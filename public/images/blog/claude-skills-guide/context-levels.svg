<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="Three-level progressive context loading">
  <rect x="0.75" y="0.75" width="718.5" height="338.5" rx="12" fill="#FAF8FA" stroke="#E3DCE5" stroke-width="1.5"/>
  <path d="M1 40H719" stroke="#E3DCE5" stroke-width="1.5"/>
  <text x="24" y="26" fill="#6A6170" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="1">PROGRESSIVE CONTEXT LOADING</text>
  <rect x="30" y="60" width="660" height="72" rx="10" fill="#EFE6F2" stroke="#6A3D7C" stroke-width="1.25"/>
  <text x="50" y="83" fill="#6A3D7C" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" xml:space="preserve">LEVEL 1 — Metadata (ALWAYS loaded)</text>
  <text x="50" y="103" fill="#1E1822" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" xml:space="preserve">name + description  (~100 words per skill)</text>
  <text x="50" y="122" fill="#6A6170" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" xml:space="preserve">Model always "knows" the skill exists. Works like a menu. 98 skills = ~10K tokens max.</text>
  <rect x="30" y="146" width="660" height="72" rx="10" fill="#F5F0F6" stroke="#B9A2C6" stroke-width="1.25"/>
  <text x="50" y="169" fill="#6A3D7C" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" xml:space="preserve">LEVEL 2 — SKILL.md body (loads on trigger)</text>
  <text x="50" y="189" fill="#1E1822" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" xml:space="preserve">Full instructions  (&lt;5k words recommended)</text>
  <text x="50" y="208" fill="#6A6170" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" xml:space="preserve">Loads when model OR user invokes the skill. Only one skill's body loads at a time.</text>
  <rect x="30" y="232" width="660" height="72" rx="10" fill="#FFFFFF" stroke="#DDD3E1" stroke-width="1.25"/>
  <text x="50" y="255" fill="#6A3D7C" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" xml:space="preserve">LEVEL 3 — Bundled resources (on demand)</text>
  <text x="50" y="275" fill="#1E1822" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" xml:space="preserve">references/ · scripts/ · assets/  (unlimited)</text>
  <text x="50" y="294" fill="#6A6170" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" xml:space="preserve">Scripts execute without being read into context. Loaded only when Claude decides they're needed.</text>
</svg>
