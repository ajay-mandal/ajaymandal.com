<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d">
  <title id="t">The agentic loop and what starts the next turn</title>
  <desc id="d">Claude gathers context, takes an action, then verifies the result. If verification fails, it goes back and tries again. If it passes, the turn ends. A timer from /loop, a not-met verdict from /goal, or a blocking Stop hook starts the next turn.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6A6170"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6A3D7C"/></marker>
    <style>
      .box{fill:#F2EDF3;stroke:#DDD3E1;stroke-width:1.5}
      .acc{fill:#FFFFFF;stroke:#6A3D7C;stroke-width:1.75}
      .end{fill:#FFFFFF;stroke:#B9ACBF;stroke-width:1.5}
      .t{font:600 16px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1E1822}
      .tm{font:600 15px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1E1822}
      .s{font:13px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6A6170}
      .ln{stroke:#8A8090;stroke-width:1.75;fill:none}
      .lp{stroke:#6A3D7C;stroke-width:1.75;fill:none;stroke-dasharray:6 5}
      .lb{font:500 13px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6A6170}
      .lbp{font:600 13px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6A3D7C}
      .hd{font:600 11.5px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#6A6170;letter-spacing:1.5px}
      .bdg{fill:#EFE6F2}
      .bdt{font:600 10.5px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#6A3D7C;letter-spacing:1px}
      .nt{font:14px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#5E5563}
    </style>
  </defs>
  <rect width="900" height="500" fill="#FFFFFF"/>

  <rect class="box" x="190" y="40" width="230" height="66" rx="10"/>
  <text class="t" x="305" y="70" text-anchor="middle">1. Gather context</text>
  <text class="s" x="305" y="91" text-anchor="middle">read, search, run commands</text>
  <rect class="box" x="350" y="220" width="230" height="66" rx="10"/>
  <text class="t" x="465" y="250" text-anchor="middle">2. Take action</text>
  <text class="s" x="465" y="271" text-anchor="middle">edit, migrate, open a PR</text>
  <rect class="box" x="40" y="220" width="230" height="66" rx="10"/>
  <text class="t" x="155" y="250" text-anchor="middle">3. Verify</text>
  <text class="s" x="155" y="271" text-anchor="middle">tests, build, lint</text>
  <path class="ln" d="M380 106L439 216" marker-end="url(#a)"/>
  <path class="ln" d="M350 253H274" marker-end="url(#a)"/>
  <path class="ln" d="M180 218L239 110" marker-end="url(#a)"/>
  <text class="lb" x="140" y="158" text-anchor="end">fails:</text>
  <text class="lb" x="140" y="176" text-anchor="end">try again</text>
  <path class="ln" d="M155 286V376" marker-end="url(#a)"/>
  <text class="lb" x="165" y="338">passes</text>
  <rect class="end" x="40" y="380" width="230" height="56" rx="10"/>
  <text class="t" x="155" y="414" text-anchor="middle">Turn ends</text>
  <text class="hd" x="640" y="62">NEXT TURN STARTS WHEN</text>
  <rect class="acc" x="640" y="80" width="230" height="74" rx="10"/>
  <text class="tm" x="658" y="108">/loop</text>
  <text class="s" x="658" y="132">a timer fires</text>
  <rect class="acc" x="640" y="172" width="230" height="74" rx="10"/>
  <text class="tm" x="658" y="200">/goal</text>
  <text class="s" x="658" y="224">evaluator says “not met”</text>
  <rect class="acc" x="640" y="264" width="230" height="74" rx="10"/>
  <text class="tm" x="658" y="292">Stop hook</text>
  <text class="s" x="658" y="316">your check blocks</text>
  <path class="lp" d="M640 117H612M640 209H612M640 301H612M612 117V301"/>
  <path class="lp" d="M270 408H612V303"/>
  <path class="lp" d="M612 117V73H424" marker-end="url(#p)"/>
  <text class="lbp" x="600" y="64" text-anchor="end">back to step 1</text>
</svg>
