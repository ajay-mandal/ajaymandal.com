<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
  <title id="t">YouTube clone system design</title>
  <desc id="d">A user uploads a raw video to a Cloud Storage bucket. The bucket notifies Pub/Sub, which supplies the video to a Cloud Run video-processing service built from a Docker image on Artifact Registry. Cloud Run writes the processed video back to the bucket. Firebase Functions generate the upload URL (generateUploadUrl) and save video records to Firestore (addVideo), which the Next.js user interface reads to render videos.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6A6170"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6A3D7C"/></marker>
    <style>
      .box{fill:#F2EDF3;stroke:#DDD3E1;stroke-width:1.5}
      .acc{fill:#FFFFFF;stroke:#6A3D7C;stroke-width:1.75}
      .end{fill:#FFFFFF;stroke:#B9ACBF;stroke-width:1.5}
      .t{font:600 16px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1E1822}
      .tm{font:600 15px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1E1822}
      .s{font:13px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6A6170}
      .ln{stroke:#8A8090;stroke-width:1.75;fill:none}
      .lp{stroke:#6A3D7C;stroke-width:1.75;fill:none;stroke-dasharray:6 5}
      .lb{font:500 13px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6A6170}
      .lbp{font:600 13px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6A3D7C}
      .hd{font:600 11.5px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#6A6170;letter-spacing:1.5px}
      .bdg{fill:#EFE6F2}
      .bdt{font:600 10.5px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#6A3D7C;letter-spacing:1px}
      .nt{font:14px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#5E5563}
    </style>
  </defs>
  <rect width="900" height="470" fill="#FFFFFF"/>

  <circle cx="80" cy="132" r="16" class="end"/>
  <path class="ln" d="M50 182a30 28 0 0 1 60 0"/>
  <text class="t" x="80" y="214" text-anchor="middle">User</text>
  <rect class="acc" x="190" y="120" width="180" height="70" rx="10"/>
  <text class="t" x="280" y="151" text-anchor="middle">Cloud Storage</text>
  <text class="s" x="280" y="171" text-anchor="middle">video bucket</text>
  <rect class="box" x="470" y="120" width="140" height="70" rx="10"/>
  <text class="t" x="540" y="160" text-anchor="middle">Pub/Sub</text>
  <rect class="acc" x="720" y="120" width="160" height="70" rx="10"/>
  <text class="t" x="800" y="151" text-anchor="middle">Cloud Run</text>
  <text class="s" x="800" y="171" text-anchor="middle">video processing</text>
  <rect class="bdg" x="721" y="204" width="158" height="22" rx="11"/>
  <text class="bdt" x="800" y="219" text-anchor="middle">DOCKER · ARTIFACT REG.</text>
  <rect class="box" x="190" y="340" width="180" height="70" rx="10"/>
  <text class="t" x="280" y="371" text-anchor="middle">Firebase Functions</text>
  <text class="s" x="280" y="391" text-anchor="middle">cloud functions (fx)</text>
  <rect class="box" x="470" y="340" width="140" height="70" rx="10"/>
  <text class="t" x="540" y="380" text-anchor="middle">Firestore</text>
  <rect class="acc" x="720" y="340" width="160" height="70" rx="10"/>
  <text class="t" x="800" y="371" text-anchor="middle">User Interface</text>
  <text class="s" x="800" y="391" text-anchor="middle">Next.js</text>
  <path class="ln" d="M116 155H188" marker-end="url(#a)"/>
  <text class="lb" x="152" y="145" text-anchor="middle">raw video</text>
  <path class="ln" d="M370 155H468" marker-end="url(#a)"/>
  <text class="lb" x="420" y="145" text-anchor="middle">notify</text>
  <path class="ln" d="M610 155H718" marker-end="url(#a)"/>
  <text class="lb" x="665" y="145" text-anchor="middle">video supply</text>
  <path class="lp" d="M800 120V62H280V118" marker-end="url(#p)"/>
  <text class="lbp" x="540" y="52" text-anchor="middle">processed video</text>
  <path class="ln" d="M280 190V338" marker-end="url(#a)"/>
  <text class="lb" x="292" y="270">generateUploadUrl (fx)</text>
  <path class="ln" d="M370 375H468" marker-end="url(#a)"/>
  <text class="lb" x="420" y="365" text-anchor="middle">addVideo (fx)</text>
  <path class="ln" d="M610 375H718" marker-end="url(#a)"/>
  <text class="lb" x="665" y="365" text-anchor="middle">video rendering</text>
</svg>
