<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d">
  <title id="t">How the Claude advisor tool works</title>
  <desc id="d">The executor, a cheaper model, works through the task. At a decision point it calls the advisor, a stronger model. The advisor reads the full conversation and returns short guidance, about 400 to 700 text tokens. The executor then continues the task.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6A6170"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6A3D7C"/></marker>
    <style>
      .box{fill:#F2EDF3;stroke:#DDD3E1;stroke-width:1.5}
      .acc{fill:#FFFFFF;stroke:#6A3D7C;stroke-width:1.75}
      .end{fill:#FFFFFF;stroke:#B9ACBF;stroke-width:1.5}
      .t{font:600 16px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1E1822}
      .tm{font:600 15px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1E1822}
      .s{font:13px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6A6170}
      .ln{stroke:#8A8090;stroke-width:1.75;fill:none}
      .lp{stroke:#6A3D7C;stroke-width:1.75;fill:none;stroke-dasharray:6 5}
      .lb{font:500 13px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6A6170}
      .lbp{font:600 13px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6A3D7C}
      .hd{font:600 11.5px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#6A6170;letter-spacing:1.5px}
      .bdg{fill:#EFE6F2}
      .bdt{font:600 10.5px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#6A3D7C;letter-spacing:1px}
      .nt{font:14px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#5E5563}
    </style>
  </defs>
  <rect width="900" height="360" fill="#FFFFFF"/>

  <text class="hd" x="40" y="40">EXECUTOR (CHEAPER MODEL)</text>
  <text class="hd" x="560" y="40">ADVISOR (STRONGER MODEL)</text>
  <rect class="box" x="40" y="60" width="240" height="70" rx="10"/>
  <text class="t" x="160" y="91" text-anchor="middle">Does the work</text>
  <text class="s" x="160" y="112" text-anchor="middle">reads, edits, runs tools</text>
  <rect class="box" x="40" y="250" width="240" height="70" rx="10"/>
  <text class="t" x="160" y="281" text-anchor="middle">Continues the task</text>
  <text class="s" x="160" y="302" text-anchor="middle">applies the guidance</text>
  <rect class="acc" x="560" y="60" width="300" height="100" rx="10"/>
  <text class="t" x="710" y="95" text-anchor="middle">Reads the full conversation</text>
  <text class="s" x="710" y="120" text-anchor="middle">every tool call and result</text>
  <text class="s" x="710" y="140" text-anchor="middle">no tools, never acts</text>
  <rect class="acc" x="560" y="230" width="300" height="90" rx="10"/>
  <text class="t" x="710" y="265" text-anchor="middle">Returns short guidance</text>
  <text class="s" x="710" y="290" text-anchor="middle">about 400 to 700 text tokens</text>
  <path class="ln" d="M160 130 V248" marker-end="url(#a)"/>
  <text class="lb" x="172" y="175">1. most turns stay here</text>
  <path class="lp" d="M280 95 H558" marker-end="url(#p)"/>
  <text class="lbp" x="420" y="82" text-anchor="middle">2. asks at a decision point</text>
  <path class="lp" d="M710 160 V228" marker-end="url(#p)"/>
  <path class="lp" d="M560 275 H282" marker-end="url(#p)"/>
  <text class="lbp" x="420" y="262" text-anchor="middle">3. advice comes back</text>
</svg>
