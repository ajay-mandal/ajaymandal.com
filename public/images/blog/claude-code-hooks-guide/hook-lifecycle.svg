<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" role="img" aria-labelledby="t d">
  <title id="t">Where Claude Code hook events fire</title>
  <desc id="d">A session starts (SessionStart), you send a prompt (UserPromptSubmit), Claude decides the next step. Each tool call is wrapped by PreToolUse and PostToolUse, then control returns to Claude. When Claude has no more tool calls, Stop fires; a Stop hook can block and send Claude back to work. SessionEnd fires when the session closes.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6A6170"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6A3D7C"/></marker>
    <style>
      .box{fill:#F2EDF3;stroke:#DDD3E1;stroke-width:1.5}
      .acc{fill:#FFFFFF;stroke:#6A3D7C;stroke-width:1.75}
      .end{fill:#FFFFFF;stroke:#B9ACBF;stroke-width:1.5}
      .t{font:600 16px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1E1822}
      .tm{font:600 15px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1E1822}
      .s{font:13px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6A6170}
      .ln{stroke:#8A8090;stroke-width:1.75;fill:none}
      .lp{stroke:#6A3D7C;stroke-width:1.75;fill:none;stroke-dasharray:6 5}
      .lb{font:500 13px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6A6170}
      .lbp{font:600 13px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6A3D7C}
      .hd{font:600 11.5px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#6A6170;letter-spacing:1.5px}
      .bdg{fill:#EFE6F2}
      .bdt{font:600 10.5px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#6A3D7C;letter-spacing:1px}
      .nt{font:14px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#5E5563}
    </style>
  </defs>
  <rect width="900" height="740" fill="#FFFFFF"/>

  <rect class="acc" x="170" y="40" width="260" height="50" rx="10"/><text class="tm" x="300" y="70" text-anchor="middle">SessionStart</text>
  <rect class="acc" x="170" y="120" width="260" height="50" rx="10"/><text class="tm" x="300" y="150" text-anchor="middle">UserPromptSubmit</text>
  <rect class="box" x="170" y="200" width="260" height="50" rx="10"/><text class="t" x="300" y="230" text-anchor="middle">Claude decides next step</text>
  <rect class="acc" x="170" y="290" width="260" height="50" rx="10"/><text class="tm" x="300" y="320" text-anchor="middle">PreToolUse</text>
  <rect class="box" x="170" y="370" width="260" height="50" rx="10"/><text class="t" x="300" y="400" text-anchor="middle">Tool runs (Edit, Bash…)</text>
  <rect class="acc" x="170" y="450" width="260" height="50" rx="10"/><text class="tm" x="300" y="480" text-anchor="middle">PostToolUse</text>
  <rect class="acc" x="170" y="560" width="260" height="50" rx="10"/><text class="tm" x="300" y="590" text-anchor="middle">Stop</text>
  <rect class="acc" x="170" y="660" width="260" height="50" rx="10"/><text class="tm" x="300" y="690" text-anchor="middle">SessionEnd</text>
  <path class="ln" d="M300 90V118" marker-end="url(#a)"/>
  <path class="ln" d="M300 170V198" marker-end="url(#a)"/>
  <path class="ln" d="M300 250V288" marker-end="url(#a)"/>
  <path class="ln" d="M300 340V368" marker-end="url(#a)"/>
  <path class="ln" d="M300 420V448" marker-end="url(#a)"/>
  <path class="ln" d="M300 610V658" marker-end="url(#a)"/>
  <path class="ln" d="M430 475H470V237H434" marker-end="url(#a)"/>
  <text class="lb" transform="translate(486 356) rotate(90)" text-anchor="middle">next tool call</text>
  <path class="ln" d="M170 225H120V585H166" marker-end="url(#a)"/>
  <text class="lb" transform="translate(106 405) rotate(-90)" text-anchor="middle">no more tool calls</text>
  <path class="lp" d="M430 585H520V213H434" marker-end="url(#p)"/>
  <text class="lbp" transform="translate(536 400) rotate(90)" text-anchor="middle">Stop hook blocks: keep working</text>
  <text class="nt" x="580" y="70">Load context, check tooling</text>
  <rect class="bdg" x="580" y="128" width="84" height="20" rx="10"/><text class="bdt" x="622" y="142" text-anchor="middle">CAN BLOCK</text>
  <text class="nt" x="676" y="143">Add context or reject</text>
  <rect class="bdg" x="580" y="298" width="84" height="20" rx="10"/><text class="bdt" x="622" y="312" text-anchor="middle">CAN BLOCK</text>
  <text class="nt" x="676" y="313">Guardrails, policy</text>
  <text class="nt" x="580" y="480">Format, lint, log</text>
  <rect class="bdg" x="580" y="568" width="84" height="20" rx="10"/><text class="bdt" x="622" y="582" text-anchor="middle">CAN BLOCK</text>
  <text class="nt" x="676" y="583">Final checks</text>
  <text class="nt" x="580" y="690">Cleanup, logging</text>
  <rect class="acc" x="580" y="380" width="22" height="16" rx="4"/><text class="nt" x="612" y="393">Hook event</text>
  <rect class="box" x="720" y="380" width="22" height="16" rx="4"/><text class="nt" x="752" y="393">Claude / tool</text>
</svg>
